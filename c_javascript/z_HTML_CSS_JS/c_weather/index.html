<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App Project</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="weather-container">
    <h1 id="header"></h1>
      <div id="weather-info">
        <div id="current-date"><p>Monday, April 8, 2024</p></div>
        <div id="degree-box">
          <div id="degree">-3°C</div>
          <div id="area">Seoul</div>
          <div id="weather-imoz">🌤️</div>
        </div>

      </div>

      <div id="weather-detailsBox">
        <div id="search-box">
          <input type="text" id="search" placeholder="search">
          
        </div>
        <div id="weather-details">
          <div id="weather-details01">
            <p>Weather Details</p>
            <hr />
          </div>
          <div id="weather-details02">
            <div></div>
            <div></div>
          </div>
        </div>
      </div>    
  </div>
    
  <script src="./main.js"></script>
  <div></div>
</body>
</html>
