<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App Project</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="weather-container">
  <div class="overlay"></div>
    <h1 id="header"></h1>
      <div id="weather-info">
        <p id="day"> </p>
        <div id="degree-box">
          <div id="degree">-3°C</div>
          <div id="area">Seoul</div>
          <div id="weather-imoz">🌤️</div>
        </div>

      </div>

      <div id="weather-detailsBox">
        <div id="search-box">
          <input type="text" id="search" placeholder="search">
          
        </div>
        <div id="weather-details">
          <div id="weather-details01">
            <p>Weather Details</p>
            <hr />
          </div>
          <div id="weather-details02">
              <div id="detailsList01">
                <ul style="list-style: none;">
                  <li>Max/Min Temp</li>
                  <li>Humidity</li>
                  <li>Wind</li>
                  <li>Cloudy</li>
                </ul>
              </div>
              <div id="detailsList02">
                <ul style="list-style: none;">
                  <li>-4°C/-3°C</li>
                  <li>29%</li>
                  <li>4.69km/h</li>
                  <li>1%</li>
                </ul>
              </div>
          </div>
          <div id="detailsList03">
            <input type="checkbox" id="toggle-slider">
            <label for="toggle-slider">on/off</label>
          </div>
        </div>
      </div>    
  </div>
  <script src="./main.js"></script>
  <div></div>
</body>
</html>
